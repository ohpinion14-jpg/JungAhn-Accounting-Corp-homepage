<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>상담 접수 관리 — 정안회계법인</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-50 font-sans text-navy-900 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-[100rem] items-center justify-between px-5 lg:px-8">
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3">
          <img src="assets/logo.png" alt="" width="314" height="136" class="h-8 w-auto" onerror="this.remove()" />
          <span class="text-[16px] font-bold tracking-tight">상담 접수 관리</span>
        </div>
        <nav id="admin-nav" class="hidden items-center gap-1.5">
          <button id="nav-dash" class="rounded-lg px-4 py-2 text-sm font-semibold text-navy-600 transition-colors hover:text-navy-900">대시보드</button>
          <button id="nav-list" class="rounded-lg px-4 py-2 text-sm font-semibold text-navy-600 transition-colors hover:text-navy-900">상담 접수 내역</button>
        </nav>
      </div>
      <button id="logout-btn" class="hidden rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">로그아웃</button>
    </div>
  </header>

  <main class="mx-auto max-w-[100rem] px-5 py-10 lg:px-8">

    <!-- 로그인 -->
    <section id="login-view" class="hidden">
      <form id="login-form" class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-xl font-bold">관리자 로그인</h1>
        <p class="mt-2 text-[14.5px] leading-[1.6] text-navy-600">관리자 비밀번호를 입력해주세요.</p>
        <div class="mt-6 space-y-4">
          <div>
            <label for="admin-pass" class="mb-1.5 block text-sm font-semibold">비밀번호</label>
            <input id="admin-pass" type="password" autocomplete="current-password" class="h-12 w-full rounded-lg border border-slate-300 px-4 text-[16px] tracking-widest transition-colors focus:border-brand-700" placeholder="••••" />
          </div>
          <button type="submit" id="login-btn" class="w-full rounded-lg bg-brand-700 py-3 text-[15px] font-semibold text-white transition-colors hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">로그인</button>
        </div>
        <p id="login-error" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-[14px] font-medium text-red-700" role="alert"></p>
      </form>
    </section>

    <!-- 대시보드 -->
    <section id="dash-view" class="hidden">
      <h1 class="text-xl font-bold">대시보드</h1>
      <div class="mt-5 max-w-3xl rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="text-[15px] font-bold">월별 접수 · 등록 현황</p>
          <div class="flex items-center gap-4 text-[12.5px] font-medium text-navy-600">
            <span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-sky-500"></span>접수</span>
            <span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-brand-600"></span>등록</span>
          </div>
        </div>
        <ul id="dash-monthly" class="mt-6 space-y-5"></ul>
      </div>
    </section>

    <!-- 접수 목록 -->
    <section id="list-view" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold">상담 접수 내역</h1>
          <p id="list-count" class="mt-1 text-[14px] text-navy-600"></p>
          <p class="mt-1 text-[13px] text-navy-500">DB를 클릭하면 고객의 문의 내용을 확인할 수 있어요</p>
        </div>
        <div class="flex gap-2.5">
          <button id="refresh-btn" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">새로고침</button>
          <button id="edit-btn" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">편집</button>
          <button id="delete-btn" class="hidden rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-red-500 disabled:cursor-not-allowed disabled:opacity-50">선택 삭제</button>
          <button id="csv-btn" class="rounded-lg bg-navy-900 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-navy-800">CSV 다운로드</button>
        </div>
      </div>

      <div class="mt-5 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-[13px]">
          <thead>
            <tr class="border-b border-slate-300 bg-slate-100 text-[12.5px] font-semibold text-navy-600">
              <th class="w-12 border-r border-slate-200 px-3 py-2.5 text-center">
                <span id="no-head">No</span>
                <input id="select-all" type="checkbox" class="hidden h-4 w-4 cursor-pointer accent-red-600" aria-label="전체 선택" />
              </th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">이름</th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">연락처</th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">
                <select id="call-filter" aria-label="통화상태 필터" class="cursor-pointer border-0 bg-transparent p-0 text-[12.5px] font-semibold text-navy-600 focus:outline-none">
                  <option value="전체">통화상태 (전체)</option>
                  <option value="미발신">미발신</option>
                  <option value="통화완료">통화완료</option>
                  <option value="부재중">부재중</option>
                  <option value="재통화예정">재통화예정</option>
                  <option value="거절">거절</option>
                </select>
              </th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">전화일</th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">판매채널</th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">
                <select id="biz-filter" aria-label="사업 형태 필터" class="cursor-pointer border-0 bg-transparent p-0 text-[12.5px] font-semibold text-navy-600 focus:outline-none">
                  <option value="전체">사업 형태 (전체)</option>
                  <option value="간이">간이</option>
                  <option value="일반">일반</option>
                  <option value="법인">법인</option>
                </select>
              </th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">평균 매출</th>
              <th class="whitespace-nowrap border-r border-slate-200 px-3 py-2.5">담당자</th>
              <th class="whitespace-nowrap px-3 py-2.5">
                <select id="status-filter" aria-label="상태 필터" class="cursor-pointer border-0 bg-transparent p-0 text-[12.5px] font-semibold text-navy-600 focus:outline-none">
                  <option value="전체">상태 (전체)</option>
                  <option value="신규">신규</option>
                  <option value="보류">보류</option>
                  <option value="등록">등록</option>
                </select>
              </th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
        <p id="list-empty" class="hidden px-5 py-12 text-center text-[14.5px] text-navy-500">해당하는 상담이 없습니다.</p>
      </div>
    </section>

    <p id="loading" class="py-16 text-center text-[15px] text-navy-500">불러오는 중...</p>
  </main>

  <!-- 상세 팝업 -->
  <div id="detail-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-navy-950/60 p-5">
    <div class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="detail-name">
      <div class="flex items-start justify-between border-b border-slate-200 px-7 py-5">
        <div>
          <p id="detail-name" class="text-xl font-bold"></p>
          <p id="detail-created" class="mt-1 text-[13px] text-navy-500"></p>
        </div>
        <button id="detail-close" class="flex h-9 w-9 items-center justify-center rounded-lg text-navy-500 transition-colors hover:bg-slate-100" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="grid gap-8 p-7 md:grid-cols-[0.85fr_1.15fr]">
        <!-- 좌: 세부 정보 -->
        <dl class="text-[14.5px]">
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">연락처</dt>
            <dd id="detail-phone" class="text-right font-semibold"></dd>
          </div>
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">통화상태</dt>
            <dd class="text-right">
              <select id="detail-call-select" data-dparam="p_call_status" class="cursor-pointer rounded-md border-0 px-2.5 py-1.5 text-[12.5px] font-semibold focus:outline-none">
                <option value="미발신">미발신</option>
                <option value="통화완료">통화완료</option>
                <option value="부재중">부재중</option>
                <option value="재통화예정">재통화예정</option>
                <option value="거절">거절</option>
              </select>
            </dd>
          </div>
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">전화일</dt>
            <dd id="detail-call-at" class="text-right"></dd>
          </div>
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">판매채널</dt>
            <dd id="detail-channel" class="text-right"></dd>
          </div>
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">사업 형태</dt>
            <dd id="detail-biztype" class="text-right"></dd>
          </div>
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">평균 매출</dt>
            <dd id="detail-revenue" class="text-right"></dd>
          </div>
          <div class="flex items-center justify-between gap-4 border-b border-slate-100 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">담당자</dt>
            <dd class="text-right">
              <input id="detail-assignee-input" data-dparam="p_assignee" type="text" placeholder="담당자 입력" class="w-32 rounded-lg border border-slate-300 px-3 py-1.5 text-right text-[14px] transition-colors placeholder:text-navy-400 focus:border-brand-700 focus:outline-none" />
            </dd>
          </div>
          <div class="flex items-center justify-between gap-4 py-3">
            <dt class="shrink-0 text-[13px] font-semibold text-navy-500">상태</dt>
            <dd class="text-right">
              <select id="detail-status-select" data-dparam="p_status" class="cursor-pointer rounded-md border-0 px-2.5 py-1.5 text-[12.5px] font-semibold focus:outline-none">
                <option value="신규">신규</option>
                <option value="보류">보류</option>
                <option value="등록">등록</option>
              </select>
            </dd>
          </div>
        </dl>

        <!-- 우: 문의 내용 + 메모 -->
        <div class="flex flex-col">
          <p class="text-[13px] font-semibold text-navy-500">문의 내용</p>
          <p id="detail-message" class="mt-2 min-h-[140px] flex-1 whitespace-pre-wrap rounded-xl bg-slate-50 p-4 text-[14.5px] leading-[1.7] text-navy-700"></p>
          <label for="detail-memo" class="mt-5 text-[13px] font-semibold text-navy-500">메모 <span id="memo-saved" class="ml-1 hidden font-medium text-brand-700">저장됨 ✓</span></label>
          <textarea id="detail-memo" rows="4" placeholder="메모를 입력하세요. 입력 후 바깥을 클릭하면 자동 저장됩니다." class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-[14.5px] leading-[1.6] transition-colors placeholder:text-navy-400 focus:border-brand-700 focus:outline-none"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ikypbbziryufryzavubm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uSn4HeobiyAU4CkKDZY2Pw_lwyX4qq4';
    const PASS_KEY = 'jungahn_admin_pass';

    const CALL_STATUS_STYLE = {
      '미발신': 'bg-slate-100 text-navy-500',
      '통화완료': 'bg-brand-50 text-brand-700',
      '부재중': 'bg-amber-50 text-amber-700',
      '재통화예정': 'bg-sky-50 text-sky-700',
      '거절': 'bg-red-50 text-red-700',
    };
    const STATUS_STYLE = {
      '신규': 'bg-sky-50 text-sky-700',
      '보류': 'bg-amber-50 text-amber-700',
      '등록': 'bg-brand-50 text-brand-700',
    };
    const FIELD_MAP = {
      p_status: 'status',
      p_memo: 'memo',
      p_call_status: 'call_status',
      p_call_at: 'call_at',
      p_channel: 'channel',
      p_assignee: 'assignee',
    };

    const el = (id) => document.getElementById(id);
    let rows = [];
    let bizFilter = '전체';
    let statusFilter = '전체';
    let callFilter = '전체';
    let editMode = false;
    let selected = new Set();
    let detailId = null;

    const normStatus = (s) => (STATUS_STYLE[s] ? s : '신규');

    function show(view) {
      el('loading').classList.add('hidden');
      el('login-view').classList.toggle('hidden', view !== 'login');
      el('list-view').classList.toggle('hidden', view !== 'list');
      el('dash-view').classList.toggle('hidden', view !== 'dash');
      const loggedIn = view !== 'login';
      el('logout-btn').classList.toggle('hidden', !loggedIn);
      el('admin-nav').classList.toggle('hidden', !loggedIn);
      el('admin-nav').classList.toggle('flex', loggedIn);
      [['nav-dash', 'dash'], ['nav-list', 'list']].forEach(([id, v]) => {
        const active = view === v;
        el(id).classList.toggle('bg-navy-900', active);
        el(id).classList.toggle('text-white', active);
        el(id).classList.toggle('text-navy-600', !active);
      });
    }

    function renderDash() {
      if (!rows.length) {
        el('dash-monthly').innerHTML = '<li class="text-[14px] text-navy-500">아직 접수된 상담이 없습니다.</li>';
        return;
      }
      const months = {};
      rows.forEach((r) => {
        const d = new Date(r.created_at);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (!months[key]) months[key] = { total: 0, reg: 0 };
        months[key].total += 1;
        if (normStatus(r.status) === '등록') months[key].reg += 1;
      });
      const keys = Object.keys(months).sort();
      const max = Math.max(...keys.map((k) => months[k].total));
      el('dash-monthly').innerHTML = keys.map((k) => {
        const m = months[k];
        const [y, mo] = k.split('-');
        return `
        <li>
          <div class="flex items-center justify-between text-[13.5px]">
            <span class="font-bold">${y}년 ${Number(mo)}월</span>
            <span class="text-navy-600">접수 <strong class="text-navy-900">${m.total}건</strong> · 등록 <strong class="text-brand-700">${m.reg}건</strong></span>
          </div>
          <div class="mt-2 h-3 w-full overflow-hidden rounded bg-slate-100">
            <div class="h-3 rounded bg-sky-500" style="width:${(m.total / max) * 100}%"></div>
          </div>
          <div class="mt-1 h-3 w-full overflow-hidden rounded bg-slate-100">
            <div class="h-3 rounded bg-brand-600" style="width:${(m.reg / max) * 100}%"></div>
          </div>
        </li>`;
      }).join('');
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function rpc(name, body) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message === 'INVALID_PASSWORD' ? 'INVALID_PASSWORD' : 'REQUEST_FAILED');
      }
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    const fetchList = (password) => rpc('jungahn_get_consultations', { p_password: password });
    const getPass = () => sessionStorage.getItem(PASS_KEY);

    function visibleRows() {
      return rows.filter((r) =>
        (bizFilter === '전체' || String(r.biztype || '').includes(bizFilter)) &&
        (statusFilter === '전체' || normStatus(r.status) === statusFilter) &&
        (callFilter === '전체' || (r.call_status || '미발신') === callFilter)
      );
    }

    function updateDeleteBtn() {
      const btn = el('delete-btn');
      btn.textContent = '선택 삭제' + (selected.size ? ' (' + selected.size + ')' : '');
      btn.disabled = selected.size === 0;
    }

    function render() {
      const count = (s) => rows.filter((r) => normStatus(r.status) === s).length;
      el('list-count').textContent = '전체 ' + rows.length + '건 · 신규 ' + count('신규') + '건 · 보류 ' + count('보류') + '건 · 등록 ' + count('등록') + '건';

      el('no-head').classList.toggle('hidden', editMode);
      el('select-all').classList.toggle('hidden', !editMode);
      el('delete-btn').classList.toggle('hidden', !editMode);
      el('edit-btn').textContent = editMode ? '편집 취소' : '편집';
      updateDeleteBtn();

      const list = visibleRows();
      el('list-empty').classList.toggle('hidden', list.length > 0);
      el('list-body').innerHTML = list.map((r, i) => {
        const cs = r.call_status || '미발신';
        const st = normStatus(r.status);
        return `
        <tr data-row="${r.id}" class="group cursor-pointer border-b border-slate-100 align-middle transition-colors hover:bg-slate-50">
          <td class="w-12 border-r border-slate-100 px-3 py-2.5 text-center text-navy-500">
            ${editMode
              ? `<input data-select="${r.id}" type="checkbox" ${selected.has(r.id) ? 'checked' : ''} class="h-4 w-4 cursor-pointer accent-red-600" aria-label="선택" />`
              : String(list.length - i)}
          </td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5 font-semibold group-hover:text-brand-700" title="접수일시: ${new Date(r.created_at).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' })}">${esc(r.name)}</td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5 text-navy-700">${esc(r.phone)}</td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5">
            <select data-id="${r.id}" data-param="p_call_status" class="cursor-pointer rounded-md border-0 px-2.5 py-1.5 text-[12.5px] font-semibold focus:outline-none ${CALL_STATUS_STYLE[cs] || CALL_STATUS_STYLE['미발신']}">
              ${Object.keys(CALL_STATUS_STYLE).map((s) => `<option value="${s}" ${cs === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5">
            <input data-id="${r.id}" data-param="p_call_at" type="date" value="${esc((r.call_at || '').split('T')[0])}" class="w-[130px] rounded-md border-0 bg-transparent px-1 py-1 text-[12.5px] text-navy-700 focus:bg-slate-50 focus:outline-none" />
          </td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5">
            <input data-id="${r.id}" data-param="p_channel" type="text" value="${esc(r.channel)}" placeholder="입력" class="w-24 rounded-md border-0 bg-transparent px-1 py-1 text-[13px] text-navy-700 placeholder:text-navy-400 focus:bg-slate-50 focus:outline-none" />
          </td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5 text-navy-600">${esc(r.biztype)}</td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5 text-navy-600">${esc(r.revenue)}</td>
          <td class="whitespace-nowrap border-r border-slate-100 px-3 py-2.5">
            <input data-id="${r.id}" data-param="p_assignee" type="text" value="${esc(r.assignee)}" placeholder="입력" class="w-16 rounded-md border-0 bg-transparent px-1 py-1 text-[13px] text-navy-700 placeholder:text-navy-400 focus:bg-slate-50 focus:outline-none" />
          </td>
          <td class="whitespace-nowrap px-3 py-2.5">
            <select data-id="${r.id}" data-param="p_status" class="cursor-pointer rounded-md border-0 px-2.5 py-1.5 text-[12.5px] font-semibold focus:outline-none ${STATUS_STYLE[st]}">
              ${Object.keys(STATUS_STYLE).map((s) => `<option value="${s}" ${st === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
        </tr>`;
      }).join('');
    }

    // ===== 상세 팝업 =====
    const SELECT_BASE = 'cursor-pointer rounded-md border-0 px-2.5 py-1.5 text-[12.5px] font-semibold focus:outline-none';
    function syncDetailControls(r) {
      const cs = r.call_status || '미발신';
      const st = normStatus(r.status);
      const callSel = el('detail-call-select');
      callSel.value = cs;
      callSel.className = SELECT_BASE + ' ' + (CALL_STATUS_STYLE[cs] || CALL_STATUS_STYLE['미발신']);
      const stSel = el('detail-status-select');
      stSel.value = st;
      stSel.className = SELECT_BASE + ' ' + STATUS_STYLE[st];
    }

    function openDetail(id) {
      const r = rows.find((x) => x.id === id);
      if (!r) return;
      detailId = id;
      el('detail-name').textContent = r.name || '';
      el('detail-created').textContent = '접수일시: ' + new Date(r.created_at).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
      el('detail-phone').textContent = r.phone || '—';
      el('detail-call-at').textContent = r.call_at ? r.call_at.split('T')[0] : '—';
      el('detail-channel').textContent = r.channel || '—';
      el('detail-biztype').textContent = r.biztype || '—';
      el('detail-revenue').textContent = r.revenue || '—';
      el('detail-assignee-input').value = r.assignee || '';
      syncDetailControls(r);
      el('detail-message').textContent = r.message || '(작성된 문의 내용이 없습니다)';
      el('detail-memo').value = r.memo || '';
      el('memo-saved').classList.add('hidden');
      const m = el('detail-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeDetail() {
      const m = el('detail-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
      detailId = null;
    }

    el('detail-close').addEventListener('click', closeDetail);
    el('detail-modal').addEventListener('click', (e) => { if (e.target === el('detail-modal')) closeDetail(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

    el('detail-modal').addEventListener('change', async (e) => {
      const ctl = e.target.closest('[data-dparam]');
      if (!ctl || !detailId) return;
      const password = getPass();
      if (!password) return show('login');
      const param = ctl.dataset.dparam;
      try {
        await rpc('jungahn_update_consultation', { p_password: password, p_id: detailId, [param]: ctl.value });
        const row = rows.find((r) => r.id === detailId);
        if (row) row[FIELD_MAP[param]] = ctl.value;
        if (row) syncDetailControls(row);
        render();
      } catch (err) {
        alert('저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    });

    el('detail-memo').addEventListener('change', async () => {
      if (!detailId) return;
      const password = getPass();
      if (!password) return show('login');
      try {
        await rpc('jungahn_update_consultation', { p_password: password, p_id: detailId, p_memo: el('detail-memo').value });
        const row = rows.find((r) => r.id === detailId);
        if (row) row.memo = el('detail-memo').value;
        el('memo-saved').classList.remove('hidden');
        setTimeout(() => el('memo-saved').classList.add('hidden'), 2000);
      } catch (err) {
        alert('메모 저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    });

    // 행 클릭 → 상세 팝업 (입력 요소 클릭은 제외, 편집 모드에선 선택 토글)
    el('list-body').addEventListener('click', (e) => {
      if (e.target.closest('[data-param], [data-select], a, input, select')) return;
      const tr = e.target.closest('[data-row]');
      if (!tr) return;
      if (editMode) {
        const cb = tr.querySelector('[data-select]');
        if (cb) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change', { bubbles: true })); }
        return;
      }
      openDetail(tr.dataset.row);
    });

    el('list-body').addEventListener('change', async (e) => {
      const sel = e.target.closest('[data-select]');
      if (sel) {
        if (sel.checked) selected.add(sel.dataset.select); else selected.delete(sel.dataset.select);
        updateDeleteBtn();
        return;
      }
      const ctl = e.target.closest('[data-param]');
      if (!ctl) return;
      const password = getPass();
      if (!password) return show('login');
      const param = ctl.dataset.param;
      const value = ctl.value;
      try {
        await rpc('jungahn_update_consultation', { p_password: password, p_id: ctl.dataset.id, [param]: value });
        const row = rows.find((r) => r.id === ctl.dataset.id);
        if (row) row[FIELD_MAP[param]] = value;
        if (param === 'p_status' || param === 'p_call_status') render();
      } catch (err) {
        alert('저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
        render();
      }
    });

    el('edit-btn').addEventListener('click', () => {
      editMode = !editMode;
      selected.clear();
      el('select-all').checked = false;
      render();
    });

    el('select-all').addEventListener('change', (e) => {
      selected.clear();
      if (e.target.checked) visibleRows().forEach((r) => selected.add(r.id));
      render();
    });

    el('delete-btn').addEventListener('click', async () => {
      if (!selected.size) return;
      const password = getPass();
      if (!password) return show('login');
      if (!confirm('선택한 ' + selected.size + '건을 삭제할까요?\n삭제된 데이터는 되돌릴 수 없습니다.')) return;
      const btn = el('delete-btn');
      btn.disabled = true; btn.textContent = '삭제 중...';
      try {
        await rpc('jungahn_delete_consultations', { p_password: password, p_ids: Array.from(selected) });
        rows = rows.filter((r) => !selected.has(r.id));
        selected.clear();
        editMode = false;
        el('select-all').checked = false;
        render();
      } catch (err) {
        alert('삭제에 실패했습니다. 잠시 후 다시 시도해주세요.');
        updateDeleteBtn();
      }
    });

    el('nav-dash').addEventListener('click', () => { show('dash'); renderDash(); });
    el('nav-list').addEventListener('click', () => { show('list'); render(); });

    el('biz-filter').addEventListener('change', (e) => { bizFilter = e.target.value; render(); });
    el('status-filter').addEventListener('change', (e) => { statusFilter = e.target.value; render(); });
    el('call-filter').addEventListener('change', (e) => { callFilter = e.target.value; render(); });

    el('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      el('login-error').classList.add('hidden');
      const password = el('admin-pass').value;
      if (!password) return;
      const btn = el('login-btn');
      btn.disabled = true; btn.textContent = '확인 중...';
      try {
        rows = await fetchList(password);
        sessionStorage.setItem(PASS_KEY, password);
        show('list');
        render();
      } catch (err) {
        const box = el('login-error');
        box.textContent = err.message === 'INVALID_PASSWORD' ? '비밀번호가 올바르지 않습니다.' : '목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
        box.classList.remove('hidden');
      }
      btn.disabled = false; btn.textContent = '로그인';
    });

    el('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem(PASS_KEY);
      el('admin-pass').value = '';
      show('login');
    });

    el('refresh-btn').addEventListener('click', async () => {
      const password = getPass();
      if (!password) return show('login');
      try { rows = await fetchList(password); render(); } catch (err) { show('login'); }
    });

    el('csv-btn').addEventListener('click', () => {
      const header = ['접수일시', '이름', '연락처', '통화상태', '전화일', '판매채널', '사업형태', '평균매출', '문의내용', '담당자', '메모', '상태'];
      const csvRows = rows.map((r) => [
        new Date(r.created_at).toLocaleString('ko-KR'),
        r.name, r.phone, r.call_status, r.call_at, r.channel, r.biztype, r.revenue, r.message,
        r.assignee, r.memo, normStatus(r.status),
      ].map((v) => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(','));
      const csv = '﻿' + [header.join(','), ...csvRows].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'jungahn-consultations.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    (async () => {
      const password = getPass();
      if (password) {
        try {
          rows = await fetchList(password);
          show('list');
          render();
          return;
        } catch (err) { sessionStorage.removeItem(PASS_KEY); }
      }
      show('login');
    })();
  </script>
</body>
</html>
