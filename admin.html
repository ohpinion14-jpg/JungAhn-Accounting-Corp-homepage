<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>상담 접수 관리 — 정안회계법인</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-50 font-sans text-navy-900 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-content items-center justify-between px-5 lg:px-8">
      <div class="flex items-center gap-3">
        <img src="assets/logo.png" alt="" width="314" height="136" class="h-8 w-auto" onerror="this.remove()" />
        <span class="text-[16px] font-bold tracking-tight">상담 접수 관리</span>
      </div>
      <button id="logout-btn" class="hidden rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">로그아웃</button>
    </div>
  </header>

  <main class="mx-auto max-w-content px-5 py-10 lg:px-8">

    <!-- 로그인 -->
    <section id="login-view" class="hidden">
      <form id="login-form" class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-xl font-bold">관리자 로그인</h1>
        <p class="mt-2 text-[14.5px] leading-[1.6] text-navy-600">관리자 비밀번호를 입력해주세요.</p>
        <div class="mt-6 space-y-4">
          <div>
            <label for="admin-pass" class="mb-1.5 block text-sm font-semibold">비밀번호</label>
            <input id="admin-pass" type="password" autocomplete="current-password" class="h-12 w-full rounded-lg border border-slate-300 px-4 text-[16px] tracking-widest transition-colors focus:border-brand-700" placeholder="••••" />
          </div>
          <button type="submit" id="login-btn" class="w-full rounded-lg bg-brand-700 py-3 text-[15px] font-semibold text-white transition-colors hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">로그인</button>
        </div>
        <p id="login-error" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-[14px] font-medium text-red-700" role="alert"></p>
      </form>
    </section>

    <!-- 접수 목록 -->
    <section id="list-view" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold">상담 접수 내역</h1>
          <p id="list-count" class="mt-1 text-[14px] text-navy-600"></p>
        </div>
        <div class="flex gap-2.5">
          <button id="refresh-btn" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">새로고침</button>
          <button id="csv-btn" class="rounded-lg bg-navy-900 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-navy-800">CSV 다운로드</button>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap items-center justify-between gap-4">
        <div class="flex rounded-xl border border-slate-200 bg-white p-1 shadow-sm" role="tablist" aria-label="상담 상태">
          <button id="tab-new" role="tab" class="rounded-lg px-5 py-2.5 text-sm font-semibold transition-colors">신규 상담 <span id="count-new"></span></button>
          <button id="tab-done" role="tab" class="rounded-lg px-5 py-2.5 text-sm font-semibold transition-colors">완료 상담 <span id="count-done"></span></button>
        </div>
        <label class="flex items-center gap-2 text-sm font-semibold text-navy-700">
          사업 형태
          <select id="biz-filter" class="h-11 rounded-lg border border-slate-300 bg-white px-3 text-[14px] font-medium transition-colors focus:border-brand-700">
            <option value="전체">전체</option>
            <option value="간이">간이</option>
            <option value="일반">일반</option>
            <option value="법인">법인</option>
          </select>
        </label>
      </div>

      <div class="mt-4 overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-[14px]">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-[13px] uppercase tracking-wider text-navy-500">
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">접수일시</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">성함</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">연락처</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">사업 형태</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">평균 매출</th>
              <th class="px-5 py-3.5 font-semibold">문의 내용</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">처리</th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
        <p id="list-empty" class="hidden px-5 py-12 text-center text-[14.5px] text-navy-500">해당하는 상담이 없습니다.</p>
      </div>
    </section>

    <p id="loading" class="py-16 text-center text-[15px] text-navy-500">불러오는 중...</p>
  </main>

  <script>
    const SUPABASE_URL = 'https://ikypbbziryufryzavubm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uSn4HeobiyAU4CkKDZY2Pw_lwyX4qq4';
    const PASS_KEY = 'jungahn_admin_pass';

    const TAB_ACTIVE = ['bg-navy-900', 'text-white'];
    const TAB_INACTIVE = ['text-navy-600'];

    const el = (id) => document.getElementById(id);
    let rows = [];
    let currentTab = 'new';
    let currentFilter = '전체';

    function show(view) {
      el('loading').classList.add('hidden');
      el('login-view').classList.toggle('hidden', view !== 'login');
      el('list-view').classList.toggle('hidden', view !== 'list');
      el('logout-btn').classList.toggle('hidden', view !== 'list');
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function rpc(name, body) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message === 'INVALID_PASSWORD' ? 'INVALID_PASSWORD' : 'REQUEST_FAILED');
      }
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    const fetchList = (password) => rpc('jungahn_get_consultations', { p_password: password });

    function visibleRows() {
      return rows.filter((r) =>
        (r.status || 'new') === currentTab &&
        (currentFilter === '전체' || String(r.biztype || '').includes(currentFilter))
      );
    }

    function render() {
      const newCount = rows.filter((r) => (r.status || 'new') === 'new').length;
      const doneCount = rows.length - newCount;
      el('count-new').textContent = '(' + newCount + ')';
      el('count-done').textContent = '(' + doneCount + ')';
      el('list-count').textContent = '전체 ' + rows.length + '건';

      [el('tab-new'), el('tab-done')].forEach((tab, i) => {
        const active = (i === 0) === (currentTab === 'new');
        tab.classList.remove(...TAB_ACTIVE, ...TAB_INACTIVE);
        tab.classList.add(...(active ? TAB_ACTIVE : TAB_INACTIVE));
        tab.setAttribute('aria-selected', String(active));
      });

      const list = visibleRows();
      el('list-empty').classList.toggle('hidden', list.length > 0);
      el('list-body').innerHTML = list.map((r) => `
        <tr class="border-b border-slate-100 align-top">
          <td class="whitespace-nowrap px-5 py-4 text-navy-600">${new Date(r.created_at).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' })}</td>
          <td class="whitespace-nowrap px-5 py-4 font-semibold">${esc(r.name)}</td>
          <td class="whitespace-nowrap px-5 py-4"><a class="text-brand-700 hover:underline" href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
          <td class="whitespace-nowrap px-5 py-4 text-navy-600">${esc(r.biztype)}</td>
          <td class="whitespace-nowrap px-5 py-4 text-navy-600">${esc(r.revenue)}</td>
          <td class="min-w-[240px] px-5 py-4 leading-[1.6] text-navy-700">${esc(r.message)}</td>
          <td class="whitespace-nowrap px-5 py-4">
            ${currentTab === 'new'
              ? `<button data-id="${r.id}" data-next="done" class="status-btn rounded-lg bg-brand-700 px-3.5 py-2 text-[13px] font-semibold text-white transition-colors hover:bg-brand-600">완료 처리</button>`
              : `<button data-id="${r.id}" data-next="new" class="status-btn rounded-lg border border-slate-300 px-3.5 py-2 text-[13px] font-semibold text-navy-700 transition-colors hover:border-navy-500">신규로 되돌리기</button>`}
          </td>
        </tr>`).join('');
    }

    el('list-body').addEventListener('click', async (e) => {
      const btn = e.target.closest('.status-btn');
      if (!btn) return;
      const password = sessionStorage.getItem(PASS_KEY);
      if (!password) return show('login');
      btn.disabled = true;
      btn.textContent = '처리 중...';
      try {
        await rpc('jungahn_set_consultation_status', { p_password: password, p_id: btn.dataset.id, p_status: btn.dataset.next });
        const row = rows.find((r) => r.id === btn.dataset.id);
        if (row) row.status = btn.dataset.next;
        render();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = btn.dataset.next === 'done' ? '완료 처리' : '신규로 되돌리기';
        alert('처리에 실패했습니다. 잠시 후 다시 시도해주세요.');
      }
    });

    el('tab-new').addEventListener('click', () => { currentTab = 'new'; render(); });
    el('tab-done').addEventListener('click', () => { currentTab = 'done'; render(); });
    el('biz-filter').addEventListener('change', (e) => { currentFilter = e.target.value; render(); });

    el('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      el('login-error').classList.add('hidden');
      const password = el('admin-pass').value;
      if (!password) return;
      const btn = el('login-btn');
      btn.disabled = true; btn.textContent = '확인 중...';
      try {
        rows = await fetchList(password);
        sessionStorage.setItem(PASS_KEY, password);
        show('list');
        render();
      } catch (err) {
        const box = el('login-error');
        box.textContent = err.message === 'INVALID_PASSWORD' ? '비밀번호가 올바르지 않습니다.' : '목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
        box.classList.remove('hidden');
      }
      btn.disabled = false; btn.textContent = '로그인';
    });

    el('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem(PASS_KEY);
      el('admin-pass').value = '';
      show('login');
    });

    el('refresh-btn').addEventListener('click', async () => {
      const password = sessionStorage.getItem(PASS_KEY);
      if (!password) return show('login');
      try { rows = await fetchList(password); render(); } catch (err) { show('login'); }
    });

    el('csv-btn').addEventListener('click', () => {
      const header = ['접수일시', '성함', '연락처', '사업형태', '평균매출', '문의내용', '상태'];
      const csvRows = rows.map((r) => [
        new Date(r.created_at).toLocaleString('ko-KR'),
        r.name, r.phone, r.biztype, r.revenue, r.message,
        (r.status || 'new') === 'new' ? '신규' : '완료',
      ].map((v) => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(','));
      const csv = '﻿' + [header.join(','), ...csvRows].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'jungahn-consultations.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    (async () => {
      const password = sessionStorage.getItem(PASS_KEY);
      if (password) {
        try {
          rows = await fetchList(password);
          show('list');
          render();
          return;
        } catch (err) { sessionStorage.removeItem(PASS_KEY); }
      }
      show('login');
    })();
  </script>
</body>
</html>
