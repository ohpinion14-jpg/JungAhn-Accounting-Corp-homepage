<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>상담 접수 관리 — 정안회계법인</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-navy-900 antialiased">

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-content items-center justify-between px-5 lg:px-8">
      <div class="flex items-center gap-3">
        <img src="assets/logo.png" alt="" width="314" height="136" class="h-8 w-auto" onerror="this.remove()" />
        <span class="text-[16px] font-bold tracking-tight">상담 접수 관리</span>
      </div>
      <button id="logout-btn" class="hidden rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">로그아웃</button>
    </div>
  </header>

  <main class="mx-auto max-w-content px-5 py-10 lg:px-8">

    <!-- 로그인 -->
    <section id="login-view" class="hidden">
      <div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-xl font-bold">관리자 로그인</h1>
        <p class="mt-2 text-[14.5px] leading-[1.6] text-navy-600">등록된 관리자 이메일로 인증 코드를 받아 로그인합니다.</p>

        <div id="email-step" class="mt-6 space-y-4">
          <div>
            <label for="admin-email" class="mb-1.5 block text-sm font-semibold">이메일</label>
            <input id="admin-email" type="email" autocomplete="email" class="h-12 w-full rounded-lg border border-slate-300 px-4 text-[16px] transition-colors focus:border-brand-700" placeholder="admin@example.com" />
          </div>
          <button id="send-code-btn" class="w-full rounded-lg bg-brand-700 py-3 text-[15px] font-semibold text-white transition-colors hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">인증 코드 받기</button>
        </div>

        <div id="code-step" class="mt-6 hidden space-y-4">
          <p class="rounded-lg bg-brand-50 px-4 py-3 text-[14px] text-brand-700">이메일로 6자리 인증 코드를 보냈습니다. 메일함을 확인해주세요.</p>
          <div>
            <label for="admin-code" class="mb-1.5 block text-sm font-semibold">인증 코드</label>
            <input id="admin-code" type="text" inputmode="numeric" autocomplete="one-time-code" class="h-12 w-full rounded-lg border border-slate-300 px-4 text-[16px] tracking-widest transition-colors focus:border-brand-700" placeholder="000000" />
          </div>
          <button id="verify-btn" class="w-full rounded-lg bg-brand-700 py-3 text-[15px] font-semibold text-white transition-colors hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60">로그인</button>
          <button id="back-btn" class="w-full rounded-lg border border-slate-300 py-3 text-[15px] font-semibold text-navy-700 transition-colors hover:border-navy-500">이메일 다시 입력</button>
        </div>

        <p id="login-error" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-[14px] font-medium text-red-700" role="alert"></p>
      </div>
    </section>

    <!-- 접수 목록 -->
    <section id="list-view" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold">상담 접수 내역</h1>
          <p id="list-count" class="mt-1 text-[14px] text-navy-600"></p>
        </div>
        <div class="flex gap-2.5">
          <button id="refresh-btn" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-navy-700 transition-colors hover:border-navy-500">새로고침</button>
          <button id="csv-btn" class="rounded-lg bg-navy-900 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-navy-800">CSV 다운로드</button>
        </div>
      </div>

      <div class="mt-6 overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-[14px]">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-[13px] uppercase tracking-wider text-navy-500">
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">접수일시</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">성함</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">연락처</th>
              <th class="whitespace-nowrap px-5 py-3.5 font-semibold">사업 형태</th>
              <th class="px-5 py-3.5 font-semibold">문의 내용</th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
        <p id="list-empty" class="hidden px-5 py-12 text-center text-[14.5px] text-navy-500">접수 내역이 없습니다. (권한이 없는 계정이면 목록이 비어 보입니다)</p>
      </div>
    </section>

    <p id="loading" class="py-16 text-center text-[15px] text-navy-500">불러오는 중...</p>
  </main>

  <script>
    const SUPABASE_URL = 'https://ikypbbziryufryzavubm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uSn4HeobiyAU4CkKDZY2Pw_lwyX4qq4';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const el = (id) => document.getElementById(id);
    let rows = [];

    function show(view) {
      el('loading').classList.add('hidden');
      el('login-view').classList.toggle('hidden', view !== 'login');
      el('list-view').classList.toggle('hidden', view !== 'list');
      el('logout-btn').classList.toggle('hidden', view !== 'list');
    }

    function loginError(msg) {
      const box = el('login-error');
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function loadList() {
      const { data, error } = await sb
        .from('jungahn_consultations')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        el('list-count').textContent = '목록을 불러오지 못했습니다: ' + error.message;
        return;
      }
      rows = data || [];
      el('list-count').textContent = '총 ' + rows.length + '건';
      el('list-empty').classList.toggle('hidden', rows.length > 0);
      el('list-body').innerHTML = rows.map((r) => `
        <tr class="border-b border-slate-100 align-top">
          <td class="whitespace-nowrap px-5 py-4 text-navy-600">${new Date(r.created_at).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' })}</td>
          <td class="whitespace-nowrap px-5 py-4 font-semibold">${esc(r.name)}</td>
          <td class="whitespace-nowrap px-5 py-4"><a class="text-brand-700 hover:underline" href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
          <td class="whitespace-nowrap px-5 py-4 text-navy-600">${esc(r.biztype)}</td>
          <td class="min-w-[240px] px-5 py-4 leading-[1.6] text-navy-700">${esc(r.message)}</td>
        </tr>`).join('');
    }

    el('send-code-btn').addEventListener('click', async () => {
      el('login-error').classList.add('hidden');
      const email = el('admin-email').value.trim();
      if (!email) return loginError('이메일을 입력해주세요.');
      const btn = el('send-code-btn');
      btn.disabled = true; btn.textContent = '전송 중...';
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
      btn.disabled = false; btn.textContent = '인증 코드 받기';
      if (error) return loginError('코드 전송 실패: ' + error.message);
      el('email-step').classList.add('hidden');
      el('code-step').classList.remove('hidden');
      el('admin-code').focus();
    });

    el('verify-btn').addEventListener('click', async () => {
      el('login-error').classList.add('hidden');
      const email = el('admin-email').value.trim();
      const token = el('admin-code').value.trim();
      if (!token) return loginError('인증 코드를 입력해주세요.');
      const btn = el('verify-btn');
      btn.disabled = true; btn.textContent = '확인 중...';
      const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
      btn.disabled = false; btn.textContent = '로그인';
      if (error) return loginError('로그인 실패: ' + error.message);
      show('list');
      loadList();
    });

    el('back-btn').addEventListener('click', () => {
      el('code-step').classList.add('hidden');
      el('email-step').classList.remove('hidden');
    });

    el('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      show('login');
    });

    el('refresh-btn').addEventListener('click', loadList);

    el('csv-btn').addEventListener('click', () => {
      const header = ['접수일시', '성함', '연락처', '사업형태', '문의내용'];
      const csvRows = rows.map((r) => [
        new Date(r.created_at).toLocaleString('ko-KR'),
        r.name, r.phone, r.biztype, r.message,
      ].map((v) => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(','));
      const csv = '﻿' + [header.join(','), ...csvRows].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'jungahn-consultations.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) { show('list'); loadList(); } else { show('login'); }
    })();
  </script>
</body>
</html>
